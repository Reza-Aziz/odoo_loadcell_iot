# Mosquitto broker untuk IoT loadcell.
# 1883 = plaintext (hanya untuk container lain di network compose),
# 8883 = TLS (satu-satunya port yang dibuka ke host).

persistence true
persistence_location /mosquitto/data/

allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883
protocol mqtt

listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

log_dest stdout
connection_messages true
